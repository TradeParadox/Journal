<html lang="en">
<head>
<meta charset="utf-8">

<title>Trading Universe | Sreejith Trade Paradox</title>
<meta name="description" content="An interactive 3D trading world: 3D candlesticks, crypto coins and forex pairs. Drag to rotate, scroll to zoom, click a symbol.">
<meta name="theme-color" content="#050716">

<link rel="apple-touch-icon" href="logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#050716;--ink:#eef3ff;--mute:#9aa8cc;--dim:#69759a;--line:rgba(150,190,255,.16);--cy:#4de3ff;--vi:#8f7bff;--pk:#ff4fd8;--up:#35f0a8;--dn:#ff5c8a;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--num:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:8px}
#stage{position:fixed;inset:0;background:radial-gradient(1100px 700px at 50% 40%,#0d1442,#050716 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.drag{cursor:grabbing}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.top{left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0)) 18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand img{width:36px;height:36px;border-radius:10px}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cy)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:rgba(8,12,40,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);transition:all .25s}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--cy),var(--vi));color:#04101c}
.links{display:flex;gap:8px}
.pill{padding:9px 16px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-weight:600;background:rgba(8,12,40,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,background .2s}
.pill:hover{border-color:var(--cy);background:rgba(77,227,255,.1)}
.pill.go{background:linear-gradient(90deg,var(--cy),var(--vi));color:#04101c;border:0}
.panel{left:18px;bottom:calc(64px + env(safe-area-inset-bottom,0));width:min(330px,calc(100vw - 36px));padding:18px;border:1px solid var(--line);border-radius:20px;background:rgba(8,12,40,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.panel::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(125,240,255,.9) 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sp 6s linear infinite;pointer-events:none}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes sp{to{--a:360deg}}
.kind{font-family:var(--num);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cy)}
.sym{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.sym b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sym span{color:var(--mute);font-size:14px}
.px{font-family:var(--num);font-size:26px;margin-top:10px}
.ch{font-family:var(--num);font-size:14px;margin-left:8px}.ch.up{color:var(--up)}.ch.dn{color:var(--dn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.stats small{display:block;font-size:11px;color:var(--mute)}.stats b{font-family:var(--num);font-size:13px;font-weight:500}
.note{font-size:11px;color:var(--dim);margin-top:12px}
.help{text-shadow:0 1px 8px #050716;right:18px;bottom:calc(64px + env(safe-area-inset-bottom,0));text-align:right;font-size:12px;color:var(--mute);line-height:1.7;max-width:230px}
.help b{color:var(--ink);font-weight:600}
.zoom{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;align-items:flex-end}
.zoom button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(8,12,40,.65);font-size:20px;line-height:1}
.tape{left:0;right:0;bottom:0;height:48px;overflow:hidden;border-top:1px solid var(--line);background:rgba(5,7,22,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0);height:calc(48px + env(safe-area-inset-bottom,0))}
.tape-in{display:inline-flex;height:48px;align-items:center;animation:mq 60s linear infinite;white-space:nowrap}
.tape:hover .tape-in{animation-play-state:paused}
.tape button{display:inline-flex;align-items:center;gap:10px;padding:0 22px;height:48px;font-family:var(--num);font-size:13px;color:var(--mute);transition:color .2s,background .2s}
.tape button:hover,.tape button.on{color:var(--ink);background:rgba(77,227,255,.08)}
.tape b{font-weight:600;color:var(--ink)}.tape .u{color:var(--up)}.tape .d{color:var(--dn)}
@keyframes mq{to{transform:translateX(-50%)}}
.hint{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:4;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);pointer-events:none;transition:opacity .8s}
@media (max-width:820px){
  .top{flex-wrap:wrap}.brand small{display:none}
  .seg{order:3;width:100%;justify-content:center}.seg button{flex:1}
  .help{display:none}.panel{bottom:calc(58px + env(safe-area-inset-bottom,0));padding:14px}.sym b{font-size:28px}.px{font-size:22px;margin-top:6px}.stats{display:none}.note{display:none}
  .zoom{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0));margin:0}
  .hint{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0))}
}
@media (max-width:480px){.links .pill:not(.go){display:none}.brand span{font-size:15px}}
@media (prefers-reduced-motion:reduce){.panel::before,.tape-in{animation:none}}
</style>

    var op=v,c=op*(1+drift+(Math.random()-.5)*a.v*.02),h=Math.max(op,c)*(1+Math.random()*a.v*.006),l=Math.min(op,c)*(1-Math.random()*a.v*.006);v=c;return {o:op,c:c,h:h,l:l,vol:.3+Math.random()*.7,born:0}}

/* ---------- 3D math ---------- */
var yaw=.7,pitch=.42,dist=31,tYaw=.7,tPitch=.42,tDist=31,vy=0,tgt=[0,2.6,0],drag=false,idle=0,F=800,cx0=0,cy0=0;

  var f=[tgt[0]-cp[0],tgt[1]-cp[1],tgt[2]-cp[2]],l=Math.hypot(f[0],f[1],f[2]);cf=[f[0]/l,f[1]/l,f[2]/l];

          [[1,0,0],[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]]],[[-1,0,0],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]]]];
  for(var i=0;i<F6.length;i++){var n=F6[i][0].slice(),pts=F6[i][1],c=[0,0,0],j;
    if(mir){n[1]=-n[1];pts=pts.map(function(p){return [p[0],-p[1],p[2]]})}
    for(j=0;j<4;j++){c[0]+=pts[j][0]/4;c[1]+=pts[j][1]/4;c[2]+=pts[j][2]/4}
    if(dot(n,[c[0]-cp[0],c[1]-cp[1],c[2]-cp[2]])>=0)continue;

/* ---------- orbiters ---------- */

ALL.forEach(function(a,i){var list=a.k==='crypto'?CR:FX,idx=list.indexOf(a);a.ang0=idx/list.length*Math.PI*2;a.y0=a.k==='crypto'?3.6+Math.sin(idx*1.7)*1.6:1.7+Math.cos(idx*1.3)*.8;a.vis=1;a.hit=null});

  var o=orbitPos(a,t),th=t*.9+a.ang0*2,u=[Math.cos(th),0,Math.sin(th)],nrm=[-Math.sin(th),0,Math.cos(th)],r=1.05*a.vis,thick=.28;

    else{var g=ctx.createRadialGradient(-.3,-.35,.1,0,0,1.05);g.addColorStop(0,a.c2);g.addColorStop(.55,a.c);g.addColorStop(1,rgba(a.c,1,.6));ctx.fillStyle=g;ctx.fill();
      ctx.lineWidth=.07;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();ctx.beginPath();ctx.arc(0,0,.78,0,7);ctx.lineWidth=.035;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();
      if(side<0)ctx.scale(-1,1);ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=3;ctx.textAlign='center';ctx.textBaseline='middle';

function drawCard(a,t){

  var toC=[cp[0]-o[0],cp[1]-o[1],cp[2]-o[2]],side=dot(nrm,toC)>=0?1:-1;

  ctx.fillStyle=a.a;ctx.beginPath();ctx.arc(.5,chh/2,.24,0,7);ctx.fill();ctx.fillStyle=a.b;ctx.beginPath();ctx.arc(.5+.26,chh/2,.24,0,7);ctx.globalAlpha=a.vis*.95;ctx.fill();ctx.globalAlpha=a.vis;
  ctx.fillStyle='#eef3ff';ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='700 .42px Schibsted Grotesk,sans-serif';ctx.fillText(a.s,1.05,chh/2-.03);
  ctx.restore();
  a.hit={x:pc.x,y:pc.y,r:Math.max(16,w*pc.s*.9)};
  if(cur&&cur.asset===a){ctx.save();ctx.strokeStyle='#7df0ff';ctx.lineWidth=2;ctx.shadowColor='#4de3ff';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(pc.x,pc.y,a.hit.r*1.25,0,7);ctx.stroke();ctx.restore()}
}

/* ---------- dust ---------- */
var DUST=[];for(var i=0;i<170;i++)DUST.push({x:(Math.random()-.5)*50,y:Math.random()*14,z:(Math.random()-.5)*50,s:Math.random()*1.4+.4,p:Math.random()*6.28});

/* ---------- scene draw ---------- */
function ease(t){return 1-Math.pow(1-t,3)}
function frame(t,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  cam();
  // floor grid + rings
  var G=26,stp=2;ctx.lineWidth=1;
  for(var gx=-G;gx<=G;gx+=stp){var a=P(gx,0,-G),b=P(gx,0,G);if(a&&b){var al=Math.max(0,.16-Math.abs(gx)/G*.12);ctx.strokeStyle='rgba(120,170,255,'+al+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  for(var gz=-G;gz<=G;gz+=stp){var c=P(-G,0,gz),d=P(G,0,gz);if(c&&d){var al2=Math.max(0,.16-Math.abs(gz)/G*.12);ctx.strokeStyle='rgba(120,170,255,'+al2+')';ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.stroke()}}
  [[CIRC_R,'77,227,255'],[FX_R,'143,123,255'],[9.3,'255,79,216']].forEach(function(rg,ri){var R=rg[0];ctx.beginPath();for(var k=0;k<=96;k++){var an=k/96*Math.PI*2+(ri?-1:1)*t*.05,q=P(Math.cos(an)*R,0,Math.sin(an)*R);if(!q)continue;k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}
    ctx.strokeStyle='rgba('+rg[1]+','+(ri===2?.18:.32)+')';ctx.lineWidth=1.2;ctx.setLineDash(ri===2?[2,7]:[]);ctx.stroke();ctx.setLineDash([])});
  // dust (far part)
  var dl=[];DUST.forEach(function(d){d.y+=dt*.25;if(d.y>14)d.y=0;var q=P(d.x,d.y,d.z);if(q)dl.push([q.z,q.x,q.y,d])});
  // chart data
  var arr=cur.arr,bw=.15,Ymin=yMin,Ymax=yMax,span=Ymax-Ymin||1;
  function Yv(v){return (v-Ymin)/span*CH}
  var bld=build;
  function cx(i){return (i-(N+1)/2)*SP-slide*SP}
  // mirrored reflection
  for(var i=0;i<arr.length;i++){var k=arr[i],x=cx(i);if(x<-N*SP/2-.4||x>N*SP/2+.4)continue;var e=Math.min(1,Math.max(0,bld*N*1.4-i*1.0+.0)/1.0);e=ease(Math.min(1,Math.max(0,bld*1.6-i/arr.length*.6)));var up=k.c>=k.o,col=up?'#35f0a8':'#ff5c8a',y0=Yv(Math.min(k.o,k.c))*e,y1=Math.max(Yv(Math.max(k.o,k.c))*e,y0+.05);
    box(x-bw,x+bw,y0,y1,-bw,bw,col,.16,true)}
  // floor glow plate
  var f1=P(-11,0,-4),f2=P(11,0,-4),f3=P(11,0,4),f4=P(-11,0,4);if(f1&&f2&&f3&&f4){var gg=ctx.createLinearGradient(0,f1.y,0,f3.y);gg.addColorStop(0,'rgba(77,227,255,.05)');gg.addColorStop(1,'rgba(143,123,255,.10)');ctx.fillStyle=gg;ctx.beginPath();ctx.moveTo(f1.x,f1.y);ctx.lineTo(f2.x,f2.y);ctx.lineTo(f3.x,f3.y);ctx.lineTo(f4.x,f4.y);ctx.closePath();ctx.fill()}
  // collect depth-sorted drawables
  var items=[];
  // candles
  for(var j=0;j<arr.length;j++){(function(j){var k=arr[j],x=cx(j);if(x<-N*SP/2-.4||x>N*SP/2+.4)return;var p=P(x,2,0);if(!p)return;items.push({z:p.z,f:function(){
      var e=ease(Math.min(1,Math.max(0,bld*1.6-j/arr.length*.6))),up=k.c>=k.o,col=up?'#35f0a8':'#ff5c8a',yo=Yv(k.o)*e,yc=Yv(k.c)*e,y0=Math.min(yo,yc),y1=Math.max(yo,yc,y0+.05);
      var edge=Math.min(1,(x+N*SP/2)/1.4,(N*SP/2-x)/1.4);edge=Math.max(.15,edge);
      box(x-.03,x+.03,Yv(k.l)*e,Yv(k.h)*e,-.03,.03,col,.9*edge);
      var last=j===arr.length-2;
      if(last){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=22}
      box(x-bw,x+bw,y0,y1,-bw,bw,col,.95*edge);
      if(last)ctx.restore();
      // volume bar
      box(x-bw,x+bw,0,k.vol*.9*e,1.5-bw,1.5+bw,up?'#35f0a8':'#ff5c8a',.32*edge)}})})(j)}
  // orbiters
  ALL.forEach(function(a){var target=(filter==='all'||filter===a.k)?1:0;a.vis+=(target-a.vis)*Math.min(1,dt*5);
    var o=orbitPos(a,t),p=P(o[0],o[1],o[2]);if(!p)return;items.push({z:p.z,f:function(){a.k==='crypto'?drawCoin(a,t):drawCard(a,t)}})});
  dl.forEach(function(d){items.push({z:d[0],f:function(){var s=d[3].s*Math.max(.6,F/d[0]/38);ctx.fillStyle='rgba(215,235,255,'+(.18+.25*Math.abs(Math.sin(t*.8+d[3].p)))+')';ctx.fillRect(d[1],d[2],s,s)}})});
  items.sort(function(a,b){return b.z-a.z});
  // curtain + close line (drawn behind candles' front but we draw before sorted list for simplicity)
  (function(){var pts=[],bot=[];for(var i=0;i<arr.length;i++){var x=cx(i);if(x<-N*SP/2||x>N*SP/2)continue;var e=ease(Math.min(1,Math.max(0,bld*1.6-i/arr.length*.6))),p=P(x,Yv(arr[i].c)*e,-.6),q=P(x,0,-.6);if(p&&q){pts.push(p);bot.push(q)}}
    if(pts.length<2)return;var g=ctx.createLinearGradient(0,Math.min.apply(null,pts.map(function(p){return p.y})),0,pts[0].y+200);g.addColorStop(0,'rgba(77,227,255,.20)');g.addColorStop(1,'rgba(77,227,255,0)');
    ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});for(var k=bot.length-1;k>=0;k--)ctx.lineTo(bot[k].x,bot[k].y);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.strokeStyle='rgba(125,240,255,.9)';ctx.lineWidth=1.8;ctx.shadowColor='#4de3ff';ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0})();
  items.forEach(function(it){it.f()});
  // price tag above last candle
  var lk=arr[arr.length-2],lp=P(cx(arr.length-2),Yv(lk.c)+.9,0);if(lp){ctx.font='600 12px IBM Plex Mono,monospace';var tx=fmt(cur.asset,lk.c),tw=ctx.measureText(tx).width+16;ctx.fillStyle='rgba(8,12,40,.85)';ctx.strokeStyle=lk.c>=lk.o?'rgba(53,240,168,.7)':'rgba(255,92,138,.7)';ctx.lineWidth=1;rr(lp.x-tw/2,lp.y-22,tw,22,8);ctx.fill();ctx.stroke();ctx.fillStyle='#eef3ff';ctx.textAlign='center';ctx.fillText(tx,lp.x,lp.y-7)}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ---------- loop ---------- */
var last=0,acc=0,raf=0,running=true;
function loop(ts){
  raf=requestAnimationFrame(loop);var dt=last?Math.min(.05,(ts-last)/1000):.016;last=ts;
  var t=ts/1000;
  if(!reduce){orbT=t;idle+=dt}
  if(!drag){if(!reduce&&idle>2.5)tYaw+=dt*.07;tYaw+=vy*dt*60;vy*=.93}
  yaw+=(tYaw-yaw)*.12;pitch+=(tPitch-pitch)*.12;dist+=(tDist-dist)*.1;
  if(build<1)build=Math.min(1,build+dt*.9);
  if(!reduce){acc+=dt*1000;slide=Math.min(1,acc/STEP);if(acc>=STEP){acc-=STEP;cur.arr.shift();cur.arr.push(cur.nx());slide=0;ymm()}}
  // smooth y range
  var mn=1e18,mx=-1e18;cur.arr.forEach(function(k){if(k.l<mn)mn=k.l;if(k.h>mx)mx=k.h});var pd=(mx-mn)*.08;yMin+=((mn-pd)-yMin)*.06;yMax+=((mx+pd)-yMax)*.06;
  frame(reduce?3:orbT,dt);hud()
}
function ymm(){}
var hudT=0;function hud(){var n=performance.now();if(n-hudT<150)return;hudT=n;var a=cur.arr,k=a[a.length-2],a0=cur.open0,ch=(k.c/a0-1)*100,hi=-1e18,lo=1e18;a.forEach(function(x){hi=Math.max(hi,x.h);lo=Math.min(lo,x.l)});
  $('#p-px').textContent=fmt(cur.asset,k.c);var c=$('#p-ch');c.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';c.className='ch '+(ch>=0?'up':'dn');$('#p-h').textContent=fmt(cur.asset,hi);$('#p-l').textContent=fmt(cur.asset,lo);$('#p-m').textContent=ch>=0?'Bullish':'Bearish'}

/* ---------- size ---------- */
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;F=Math.min(H*1.3,W*1.35);cx0=W/2;cy0=H*(W<820?.4:.5);if(W<820)tDist=Math.max(tDist,38)}
size();addEventListener('resize',size);

/* ---------- input ---------- */
var px0=0,py0=0,moved=0,downAt=0,pid=null;
cv.addEventListener('pointerdown',function(e){drag=true;pid=e.pointerId;cv.setPointerCapture(pid);px0=e.clientX;py0=e.clientY;moved=0;downAt=performance.now();cv.classList.add('drag');idle=0;vy=0});
cv.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-px0,dy=e.clientY-py0;px0=e.clientX;py0=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);tYaw-=dx*.006;tPitch=Math.max(.08,Math.min(1.25,tPitch+dy*.005));vy=-dx*.006/ (1/60) *.02;idle=0});
function up(e){if(!drag)return;drag=false;cv.classList.remove('drag');if(moved<6&&performance.now()-downAt<500){var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null,bd=1e9;
  ALL.forEach(function(a){if(a.vis<.5||!a.hit)return;var d=Math.hypot(a.hit.x-x,a.hit.y-y);if(d<a.hit.r*1.3&&d<bd){bd=d;best=a}});if(best)select(best)}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();tDist=Math.max(14,Math.min(46,tDist+e.deltaY*.02));idle=0},{passive:false});
$('#zin').addEventListener('click',function(){tDist=Math.max(14,tDist-4)});$('#zout').addEventListener('click',function(){tDist=Math.min(46,tDist+4)});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft')tYaw-=.12;if(e.key==='ArrowRight')tYaw+=.12;if(e.key==='ArrowUp')tPitch=Math.min(1.25,tPitch+.06);if(e.key==='ArrowDown')tPitch=Math.max(.08,tPitch-.06)});
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){filter=b.dataset.f;document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
  if(filter!=='all'&&cur.asset.k!==filter)select(filter==='crypto'?CR[0]:FX[0])})});

/* ---------- tape ---------- */
(function(){var h='';for(var r=0;r<2;r++)ALL.forEach(function(a){var ch=(Math.random()-.45)*(a.k==='crypto'?5:.8);h+='<button type="button" data-s="'+a.s+'"><b>'+a.s+'</b><span>'+fmt(a,a.p*(1+ch/100))+'</span><span class="'+(ch>=0?'u':'d')+'">'+(ch>=0?'▲':'▼')+Math.abs(ch).toFixed(2)+'%</span></button>'});
  var el=$('#tape');el.innerHTML=h;el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=ALL.filter(function(x){return x.s===b.dataset.s})[0];if(a){if(filter!=='all'&&filter!==a.k)filter='all',document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.f==='all'?'true':'false')});select(a)}})})();

select(CR[0]);
setTimeout(function(){var h=$('#hint');if(h)h.style.opacity=0},5000);
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf)}else{last=0;raf=requestAnimationFrame(loop)}});
raf=requestAnimationFrame(loop);
window.__tu={select:function(s){select(ALL.filter(function(a){return a.s===s})[0])},get hits(){return ALL.map(function(a){return [a.s,a.hit]})}};
})();
</script>
