<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sreejith Trade Paradox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: left rail (nav, currency, theme) + content column. Dashboard = KPI strip, equity curve beside a six-axis score radar, daily bars beside a win/loss ring, then recent trades. Phones swap the rail for a bottom tab bar. Profit/loss colors are semantic and always paired with a +/- sign. */
:root{
  color-scheme:light;
  --bg:#eceff5; --surface:#ffffff; --surface-2:#f4f6fb; --ink:#12151f; --ink-2:#4a5163; --ink-3:#757c91;
  --line:#dde1ec; --line-2:#eceff6; --accent:#3347e0; --accent-ink:#ffffff; --accent-soft:#e6e9fd;
  --pos:#0c8a60; --pos-soft:#dcf3ea; --neg:#cc3b34; --neg-soft:#fbe4e2; --warn:#a56a0c; --warn-soft:#fbefd6;
  --scrim:rgba(14,18,30,.45); --shadow:0 1px 2px rgba(18,21,31,.05),0 10px 28px rgba(18,21,31,.06);
  --font-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e15; --surface:#131824; --surface-2:#1a2132; --ink:#e8ebf4; --ink-2:#a8aec3; --ink-3:#7b839a;
    --line:#252c40; --line-2:#1d2436; --accent:#7a8bff; --accent-ink:#0b0e15; --accent-soft:#222a55;
    --pos:#3dcf9b; --pos-soft:#11372b; --neg:#ff7d75; --neg-soft:#42211f; --warn:#e8b04f; --warn-soft:#3b2d12;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e15; --surface:#131824; --surface-2:#1a2132; --ink:#e8ebf4; --ink-2:#a8aec3; --ink-3:#7b839a;
  --line:#252c40; --line-2:#1d2436; --accent:#7a8bff; --accent-ink:#0b0e15; --accent-soft:#222a55;
  --pos:#3dcf9b; --pos-soft:#11372b; --neg:#ff7d75; --neg-soft:#42211f; --warn:#e8b04f; --warn-soft:#3b2d12;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,dl,dd{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--ink-3)}

.app{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;grid-template-columns:224px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:22px;padding:18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.tabbar button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail-set{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-2);padding-top:16px}
.rail-set label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rail-note{font-size:12px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.top p{color:var(--ink-3);margin-top:2px}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg-ctl{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg-ctl button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13px}
.seg-ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.field-in,select.field-in{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.field-in:focus-visible{outline-offset:0}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink)}
.banner span{min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.ch h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.ch .muted{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1500px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--ink-3);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--line-2)}
.seg i{display:block;height:100%}
.seg .p{background:var(--pos)} .seg .n{background:var(--neg)} .seg .b{background:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chart{width:100%;position:relative}
.chart svg{display:block;max-width:100%}
.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;color:var(--ink-3);text-align:center;padding:12px}
.sa{font-size:11px;fill:var(--ink-3);font-family:var(--font-num)}
.gl{stroke:var(--line-2);stroke-width:1} .zl{stroke:var(--line);stroke-width:1.5}
.fp{fill:var(--pos)} .fn{fill:var(--neg)} .fa{fill:var(--accent)} .fb{fill:var(--ink-3)}
.xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.score{font-family:var(--font-num);font-size:26px;font-weight:500;color:var(--accent)}
.sub-sc{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:8px}
.sub-sc div{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line-2);padding-bottom:4px}
.sub-sc b{font-family:var(--font-num);font-weight:500;color:var(--ink)}
.ring-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.rows{display:flex;flex-direction:column;flex:1;min-width:160px}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.rows b{font-family:var(--font-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 12px;background:var(--surface-2);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;font-weight:inherit}
th button:hover{color:var(--ink)}
td{padding:10px 12px;border-top:1px solid var(--line-2);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:focus-visible{outline-offset:-2px}
.r{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill.long{background:var(--accent-soft);color:var(--accent)}
.pill.short{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.mis{background:var(--warn-soft);color:var(--warn)}
.toolbar{display:grid;grid-template-columns:minmax(160px,2fr) repeat(3,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.tsum{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px;font-size:13px;color:var(--ink-2)}
.tsum b{font-family:var(--font-num);font-weight:500;color:var(--ink)}

.cal-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.cal-head h2{font-size:18px;font-weight:600;min-width:140px}
.cal-nav{display:flex;gap:6px}
.cal-stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.cal-stats b{font-family:var(--font-num);font-weight:500;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(54px,.8fr);gap:4px}
.cal .dow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:4px 6px}
.day{min-height:78px;border-radius:9px;border:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--surface)}
.day.out{background:transparent;border-color:transparent}
.day.has{background:color-mix(in srgb,var(--c) var(--t),var(--surface));border-color:transparent}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day .dn{font-size:11px;color:var(--ink-3)}
.day .dp{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;overflow-wrap:anywhere;line-height:1.2}
.day .dt{font-size:10.5px;color:var(--ink-2)}
.day.wk{background:var(--surface-2);border-color:var(--line-2)}
.day.wk .dn{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10px}

.hb{display:grid;grid-template-columns:minmax(76px,.9fr) minmax(0,2.2fr) minmax(70px,.9fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.hb-l{font-weight:500;min-width:0;overflow-wrap:anywhere}
.hb-l small{display:block;color:var(--ink-3);font-size:11px;font-family:var(--font-num)}
.hb-t{position:relative;height:14px}
.hb-t .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.hb-t b{position:absolute;top:2px;height:10px;border-radius:3px}
.hb-t b.p{background:var(--pos)} .hb-t b.n{background:var(--neg)}
.hb-v{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dl{display:flex;flex-direction:column}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.dl b{font-family:var(--font-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-shadow:var(--shadow);animation:slide .22s ease-out}
.dr-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.dr-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.big{font-family:var(--font-num);font-size:32px;font-weight:500;letter-spacing:-.02em}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
.note-box{background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.modal .sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(600px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);animation:pop .18s ease-out}
.sheet form{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:18px;font-weight:700}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;color:var(--ink-2);font-weight:600}
.f small{color:var(--ink-3);font-size:11px}
textarea.field-in{min-height:84px;resize:vertical}
.prev{display:flex;flex-wrap:wrap;gap:6px 22px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.prev b{font-family:var(--font-num);font-weight:500}
.err{color:var(--neg);font-size:13px;min-height:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.45;max-width:240px;box-shadow:var(--shadow)}
.tip b{font-weight:600} .tip .n{font-family:var(--font-num)}
.tabbar{display:none}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer,.modal .sheet{animation:none}}

@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:16px 96px}
  .rail{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex-direction:column;gap:3px;font-size:10px;justify-content:center;align-items:center;padding:6px 1px}
  .tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
  .top h1{font-size:22px}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .q{grid-column:1/-1}
  .two{grid-template-columns:1fr}
}
@media (max-width:520px){
  .day{min-height:62px;padding:4px}
  .day .dp{font-size:10.5px}
  .day .dt{display:none}
  .cal{gap:3px}
  .card{padding:14px}
  .kpi .v{font-size:21px}
  .sub-sc{grid-template-columns:1fr}
  .hb{grid-template-columns:minmax(64px,1fr) minmax(0,1.6fr) minmax(62px,.9fr)}
}
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.au-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.au-card h1{font-size:24px;letter-spacing:-.02em;font-weight:700}
.au-card form{display:flex;flex-direction:column;gap:12px}
.au-card .seg-ctl{align-self:flex-start}
.au-msg{font-size:13px;color:var(--neg);min-height:18px}
.au-msg.ok{color:var(--pos)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0;align-self:flex-start}
.acc{display:grid;gap:12px;max-width:560px}
.bt-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.bt-panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.bt-ctl{display:grid;gap:14px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink-2);font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.bt-run{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px}
.bt-msg{color:var(--ink-2);font-size:13px;min-width:0;overflow-wrap:anywhere}
.bt-msg.bad{color:var(--neg)}
.bt-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px;margin-top:12px}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.lg i{display:inline-block;width:20px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.lg i.d{border-top-style:dashed}
details.card summary{cursor:pointer;font-weight:600;font-size:15px}
details.card[open] summary{margin-bottom:12px}
.rt{min-width:0}
.rt th,.rt td{padding:9px 8px;white-space:normal}
.rt td.r{white-space:nowrap}
</style>
</head>
<body>

<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" style="fill:var(--accent)"/><path d="M8 19V12M14 21V8M20 17V11" style="stroke:var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/></svg>
      Sreejith Trade Paradox
    </div>
    <nav class="nav" id="nav">

function genSample(){

}

/* ---------- stats ---------- */
function stats(ts){

function equityChart(el,ts){

function barPath(x,w,yb,ye,r){
  var up=ye<yb,h=Math.abs(yb-ye);if(h<.6)return 'M'+x+' '+yb+'h'+w;r=Math.min(r,w/2,h);
  return up?'M'+x+' '+yb+'V'+(ye+r)+'Q'+x+' '+ye+' '+(x+r)+' '+ye+'H'+(x+w-r)+'Q'+(x+w)+' '+ye+' '+(x+w)+' '+(ye+r)+'V'+yb+'Z'
           :'M'+x+' '+yb+'V'+(ye-r)+'Q'+x+' '+ye+' '+(x+r)+' '+ye+'H'+(x+w-r)+'Q'+(x+w)+' '+ye+' '+(x+w)+' '+(ye-r)+'V'+yb+'Z';
}
function barChart(el,items,o){
  o=o||{};
  mount(el,function(el,W){
    if(!items.length){el.innerHTML=emptyBox('No trades in this range');return}
    var H=o.h||220,m={l:o.fmt?38:52,r:8,t:12,b:26},fmt=o.fmt||cf;
    var vals=items.map(function(i){return i.v}),tk=niceTicks(Math.min.apply(null,vals.concat(0)),Math.max.apply(null,vals.concat(0)),4);
    var y0=tk[0],y1=tk[tk.length-1],iw=W-m.l-m.r,ih=H-m.t-m.b,step=iw/items.length,bw=Math.min(40,Math.max(1.5,step-(step>8?3:1.2)));
    var Y=function(v){return m.t+(1-(v-y0)/(y1-y0))*ih},zy=Y(0),g='';
    tk.forEach(function(v){g+='<line class="'+(v===0?'zl':'gl')+'" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="sa" x="'+(m.l-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>'});
    var every=Math.max(1,Math.ceil(items.length/Math.max(1,Math.floor(iw/(o.lw||52))))),b='',lb='';
    items.forEach(function(it,i){
      var x=m.l+i*step+(step-bw)/2,cx=m.l+i*step+step/2,c=it.c||(it.v>=0?'fp':'fn');
      b+='<path class="'+c+'" d="'+barPath(+x.toFixed(1),+bw.toFixed(1),+zy.toFixed(1),+Y(it.v).toFixed(1),3)+'"/>';
      b+='<rect x="'+(m.l+i*step).toFixed(1)+'" y="'+m.t+'" width="'+step.toFixed(1)+'" height="'+ih+'" fill="transparent" data-tip="'+esc(it.tip)+'"/>';
      if(i%every===0)lb+='<text class="sa" x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.label)+'</text>';
    });
    el.innerHTML='<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.label||'Bar chart')+'">'+g+b+lb+'</svg>';
  });
}

function radar(el,parts){
  var cx=190,cy=132,R=86,n=parts.length,ang=function(i){return -Math.PI/2+i*2*Math.PI/n};
  var pt=function(i,f){return [cx+Math.cos(ang(i))*R*f,cy+Math.sin(ang(i))*R*f]};
  var poly=function(f){return parts.map(function(_,i){var p=pt(i,f);return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')};
  var g='',ax='',lb='',dots='';
  [.25,.5,.75,1].forEach(function(f){g+='<polygon points="'+poly(f)+'" fill="none" class="gl" style="stroke:var(--line)"/>'});
  parts.forEach(function(p,i){
    var e=pt(i,1),l=pt(i,1.2),c=Math.cos(ang(i));
    ax+='<line class="gl" x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'"/>';
    lb+='<text class="sa" x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="'+(Math.abs(c)<.2?'middle':c>0?'start':'end')+'">'+p[0]+'</text>';
    var v=pt(i,p[1]/100);dots+='<circle class="fa" cx="'+v[0].toFixed(1)+'" cy="'+v[1].toFixed(1)+'" r="4" style="stroke:var(--surface);stroke-width:2"/>';
  });
  var shape=parts.map(function(p,i){var q=pt(i,p[1]/100);return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
  el.innerHTML='<svg viewBox="0 0 380 264" width="100%" role="img" aria-label="Score radar across six measures">'+g+ax+'<polygon points="'+shape+'" style="fill:var(--accent);fill-opacity:.18;stroke:var(--accent)" stroke-width="2" stroke-linejoin="round"/>'+dots+lb+'</svg>';
}
function donut(s){
  var r=44,C=2*Math.PI*r,gap=3,segs=[[s.w,'var(--pos)'],[s.l,'var(--neg)'],[s.be,'var(--ink-3)']],tot=s.n||1,off=0,o='';
  segs.forEach(function(g){if(!g[0])return;var L=g[0]/tot*C,d=Math.max(.5,L-gap);o+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+g[1]+'" stroke-width="12" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=L});
  if(!s.n)o='<circle cx="60" cy="60" r="'+r+'" fill="none" style="stroke:var(--line)" stroke-width="12"/>';
  return '<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Win rate '+pct(s.wr)+'">'+o+'<text x="60" y="58" text-anchor="middle" style="fill:var(--ink);font-family:var(--font-num);font-size:19px;font-weight:500">'+pct(s.wr)+'</text><text x="60" y="76" text-anchor="middle" class="sa">win rate</text></svg>';
}
function hbars(rows,vf){
  if(!rows.length)return emptyBox('No trades in this range');
  var neg=Math.max.apply(null,[0].concat(rows.map(function(r){return -r.v}))),pos=Math.max.apply(null,[0].concat(rows.map(function(r){return r.v}))),tot=(neg+pos)||1,z=neg/tot*100;
  return rows.map(function(r){
    var w=Math.max(.8,Math.abs(r.v)/tot*100),left=r.v>=0?z:z-w;
    return '<div class="hb"><div class="hb-l">'+esc(r.label)+'<small>'+esc(r.sub)+'</small></div><div class="hb-t"><i class="zero" style="left:'+z.toFixed(2)+'%"></i><b class="'+(r.v>=0?'p':'n')+'" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></b></div><div class="hb-v '+cls(r.v)+'">'+(vf?vf(r.v):esc(money(r.v,{sign:true})))+'</div></div>';
  }).join('');
}

function filtered(){

  var l=vis().filter(function(t){
    if(q&&(t.sym+' '+(t.setup||'')+' '+(t.notes||'')).toLowerCase().indexOf(q)<0)return false;

    if(S.f.out==='win'&&!(t.net>0))return false; if(S.f.out==='loss'&&!(t.net<0))return false;

/* data loading */
function timedFetch(url,ms){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},ms||20000);
  return fetch(url,{signal:ctl.signal}).finally(function(){clearTimeout(t)});
}
async function binPage(sym,tf,lim,end,bases){
  var lastErr=null;
  for(var i=0;i<bases.length;i++){
    try{
      var r=await timedFetch(bases[i]+'/api/v3/klines?symbol='+encodeURIComponent(sym)+'&interval='+tf+'&limit='+lim+(end?'&endTime='+end:''));
      var j=await r.json().catch(function(){return null});
      if(r.ok&&Array.isArray(j))return {rows:j,base:bases[i]};
      if(r.status===400){var fe=new Error('Binance: '+((j&&j.msg)||'invalid symbol or timeframe')+'.');fe.fatal=true;throw fe}
      lastErr=new Error(r.status===451||r.status===403?'Binance is not available from your network or region.':'Binance returned error '+r.status+'.');
    }catch(e){
      if(e.fatal)throw e;
      lastErr=e.name==='AbortError'?new Error('Binance took too long to respond.'):new Error('Could not reach Binance. Check your connection.');
    }
  }
  throw lastErr||new Error('Could not reach Binance.');
}
async function fetchBinance(sym,tf,bars){
  var bases=['https://data-api.binance.vision','https://api.binance.com'],out=[],end=null,left=bars;
  while(left>0){
    var lim=Math.min(1000,left),pg=await binPage(sym,tf,lim,end,bases);
    bases=[pg.base];
    if(!pg.rows.length)break;
    out=pg.rows.concat(out);end=pg.rows[0][0]-1;left-=pg.rows.length;
    if(pg.rows.length<lim)break;
  }
  if(!out.length)throw new Error('Binance returned no candles for '+sym+'. Check the symbol, for example BTCUSDT.');
  return out.map(function(x){return {t:Math.floor(x[0]/1000),o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}});
}
async function fetchYahoo(sym,tf,rng){
  var r;
  try{r=await timedFetch('/api/candles?symbol='+encodeURIComponent(sym)+'&interval='+tf+'&range='+rng,25000)}
  catch(e){throw new Error('The data service did not respond. Yahoo data works on your deployed site, not in a local file preview.')}
  var j=await r.json().catch(function(){return null});
  if(!r.ok||!j||j.error)throw new Error((j&&j.error)||(r.status===404?'The data service is not available here. Yahoo data works on your deployed Vercel site.':'Yahoo data request failed ('+r.status+').'));
  var off=j.gmtoffset||0;
  return {candles:j.candles.map(function(x){return {t:x.t+off,o:x.o,h:x.h,l:x.l,c:x.c,v:x.v}}),name:j.name};
}
function intradayOf(cs,tf){
  if(tf&&tf!=='CSV')return ['1d','1wk'].indexOf(tf)<0;
  var gaps=[];for(var i=1;i<Math.min(cs.length,60);i++)gaps.push(cs[i].t-cs[i-1].t);
  gaps.sort(function(a,b){return a-b});return (gaps[Math.floor(gaps.length/2)]||86400)<86400;
}
async function loadAsset(k){
  var c=S.bt.cfg[k],cs,label,src,tf=c.tf;
  if(c.src==='csv'){
    var f=S.bt.csv[k];if(!f)throw new Error('Choose a CSV file first.');
    cs=f.candles;label=f.name.replace(/\.csv$/i,'');src='CSV';tf='CSV';
  }else{
    var sym=c.sym.replace(/\s+/g,'');if(!sym)throw new Error('Enter a symbol.');
    if(c.src==='binance'){sym=sym.replace('/','').toUpperCase();cs=await fetchBinance(sym,c.tf,+c.amt);label=sym;src='Binance'}
    else{var y=await fetchYahoo(sym,c.tf,c.amt);cs=y.candles;label=sym.toUpperCase();src='Yahoo'}
  }
  cs=TPD_BT.normalize(cs);
  return {k:k,label:label,src:src,tf:tf,candles:cs,intraday:intradayOf(cs,tf)};
}

async function runBt(){
  readBt();
  var C=S.bt.cfg,st=C.st,msg=$('#bt-msg'),btn=$('#bt-run');
  var bad=function(m){msg.textContent=m;msg.className='bt-msg bad';btn.disabled=false};
  if(!(st.p1>=2))return bad('Use a period of at least 2.');
  if((st.type==='sma'||st.type==='ema')&&!(st.p2>st.p1))return bad('The slow period must be larger than the fast period.');
  if(st.type==='rsi'&&!(st.lo<50&&st.hi>50))return bad('Buy below 50 and short above 50.');
  if(!(st.cap>0))return bad('Starting capital must be above zero.');
  if(!(st.size>=1&&st.size<=100))return bad('Position size must be between 1 and 100 percent.');
  if(st.sl<0||st.tp<0||st.fee<0)return bad('Stop, target and fee cannot be negative.');
  var keys=C.cmp?['a','b']:['a'];
  btn.disabled=true;msg.className='bt-msg';msg.textContent='Loading price data…';
  var loaded;
  try{
    loaded=await Promise.all(keys.map(function(k){return loadAsset(k).catch(function(e){e.message='Asset '+k.toUpperCase()+': '+e.message;throw e})}));
  }catch(e){return bad(e.message)}
  var cfg=JSON.parse(JSON.stringify(st)),res=[];
  try{
    loaded.forEach(function(a){
      var warm=TPD_BT.signals(a.candles,cfg).warm;
      if(a.candles.length<warm+20)throw new Error('Asset '+a.k.toUpperCase()+' has only '+a.candles.length+' candles. This strategy needs at least '+(warm+20)+'. Load more history or shorten the periods.');
      a.bt=TPD_BT.run(a.candles,cfg);res.push(a);
    });
  }catch(e){return bad(e.message)}
  S.bt.res=res;S.bt.resCfg=cfg;
  $('#bt-out').innerHTML=btOut();drawBtCharts();
  btn.disabled=false;msg.className='bt-msg';msg.textContent='Done. '+res.map(function(a){return a.label+': '+a.bt.stats.n+' trades'}).join(' · ');
  $('#bt-out').scrollIntoView();
}

/* charts */
function btColors(){
  var cs=getComputedStyle(document.documentElement),g=function(n){return cs.getPropertyValue(n).trim()};
  return {bg:g('--surface'),tx:g('--ink-2'),grid:g('--line-2'),bd:g('--line'),pos:g('--pos'),neg:g('--neg'),acc:g('--accent'),alt:g('--warn'),font:g('--font-num')};
}
function btMake(el,h,intraday,C){
  var chart=LightweightCharts.createChart(el,{
    width:el.clientWidth||300,height:h,
    layout:{background:{type:'solid',color:C.bg},textColor:C.tx,fontFamily:C.font,fontSize:11},
    grid:{vertLines:{color:C.grid},horzLines:{color:C.grid}},
    rightPriceScale:{borderColor:C.bd},
    timeScale:{borderColor:C.bd,timeVisible:intraday,secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal}
  });
  var ro=new ResizeObserver(function(){var w=el.clientWidth;if(w>10)chart.applyOptions({width:w})});
  ro.observe(el);btCharts.push({chart:chart,ro:ro});return chart;
}
function drawBtCharts(){
  btDispose();
  var R=S.bt&&S.bt.res;
  if(!R||!$('#bt-c-eq'))return;
  if(!window.LightweightCharts){$$('#bt-out .chart').forEach(function(e){e.innerHTML=emptyBox('The chart library could not load. Check your connection and reload.')});return}
  var C=btColors(),cols={a:C.acc,b:C.alt},charts=[],cap=S.bt.resCfg.cap;
  R.forEach(function(a){
    var ch=btMake($('#bt-c-'+a.k),340,a.intraday,C);charts.push(ch);
    var ser=ch.addCandlestickSeries({upColor:C.pos,downColor:C.neg,borderUpColor:C.pos,borderDownColor:C.neg,wickUpColor:C.pos,wickDownColor:C.neg});
    ser.setData(a.candles.map(function(x){return {time:x.t,open:x.o,high:x.h,low:x.l,close:x.c}}));
    if(a.bt.lines){
      [['f',C.acc],['s',C.tx]].forEach(function(p){
        var ls=ch.addLineSeries({color:p[1],lineWidth:1,priceLineVisible:false,lastValueVisible:false});
        var d=[];a.bt.lines[p[0]].forEach(function(v,i){if(!isNaN(v))d.push({time:a.candles[i].t,value:v})});ls.setData(d);
      });
    }
    var mk=[];
    a.bt.trades.forEach(function(t){
      mk.push({time:t.t0,position:t.dir===1?'belowBar':'aboveBar',color:C.acc,shape:t.dir===1?'arrowUp':'arrowDown'});
      mk.push({time:t.t1,position:t.dir===1?'aboveBar':'belowBar',color:t.pnl>=0?C.pos:C.neg,shape:'circle'});
    });
    mk.sort(function(x,y){return x.time-y.time});ser.setMarkers(mk);
    ch.timeScale().fitContent();
  });
  var eq=btMake($('#bt-c-eq'),300,R.some(function(a){return a.intraday}),C),first=null;
  var fmt={type:'custom',minMove:0.01,formatter:function(p){return p.toFixed(1)+'%'}};
  R.forEach(function(a){
    var s1=eq.addLineSeries({color:cols[a.k],lineWidth:2,priceFormat:fmt,priceLineVisible:false,lastValueVisible:true});
    s1.setData(a.bt.eq.map(function(p){return {time:p.t,value:(p.v/cap-1)*100}}));
    var s2=eq.addLineSeries({color:cols[a.k],lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceFormat:fmt,priceLineVisible:false,lastValueVisible:false});
    s2.setData(a.bt.bh.map(function(p){return {time:p.t,value:(p.v/cap-1)*100}}));
    if(!first)first=s1;
  });
  if(first)first.createPriceLine({price:0,color:C.bd,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Solid,axisLabelVisible:false});
  eq.timeScale().fitContent();
  if(R.length>1&&S.bt.sync){
    var lock=false;
    charts.forEach(function(c,i){
      var other=charts[1-i];
      c.timeScale().subscribeVisibleTimeRangeChange(function(r){
        if(lock||!r)return;lock=true;
        try{other.timeScale().setVisibleRange(r)}catch(e){}
        lock=false;
      });
    });
  }
}

  var rows=S.trades.filter(function(t){return !t.ex}).sort(function(a,b){return a.dt<b.dt?-1:1}).map(function(t){

  showAuth(true);setMode('login');
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){
    authMsg('Setup needed: add your Supabase URL and anon key to config.js (see README).');
    $('#au-go').disabled=true;return;
  }
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  if(CFG.GOOGLE_LOGIN)$('#au-g').hidden=false;
  $$('#au-tabs [data-am]').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.am)})});
  $('#au-forgot').addEventListener('click',function(){setMode(authMode==='reset'?'login':'reset')});
  $('#au-g').addEventListener('click',function(){sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}})});
  $('#au-form').addEventListener('submit',async function(e){
    e.preventDefault();authMsg('');
    var email=$('#au-email').value.trim(),pw=$('#au-pw').value,btn=$('#au-go');
    if(authMode!=='recover'&&!email){authMsg('Enter your email address.');return}
    if(authMode!=='reset'&&pw.length<6){authMsg('Use a password with at least 6 characters.');return}
    btn.disabled=true;
    try{
      if(authMode==='login'){var r1=await sb.auth.signInWithPassword({email:email,password:pw});if(r1.error)throw r1.error}
      else if(authMode==='signup'){
        var r2=await sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:location.origin}});
        if(r2.error)throw r2.error;
        if(!r2.data.session)authMsg('Check your email to confirm your account, then log in.',true);
      }else if(authMode==='reset'){
        var r3=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
        if(r3.error)throw r3.error;authMsg('Reset link sent. Check your email.',true);
      }else{
        var r4=await sb.auth.updateUser({password:pw});if(r4.error)throw r4.error;
        authMode='login';setMode('login');enter(r4.data.user);
      }
    }catch(err){authMsg(err.message||'Something went wrong. Try again.')}
    btn.disabled=false;
  });
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='PASSWORD_RECOVERY'){setTimeout(function(){showAuth(true);setMode('recover')},0);return}
    if(ev==='SIGNED_OUT'){setTimeout(leave,0);return}
    if(session&&session.user&&authMode!=='recover'&&(!S.user||S.user.id!==session.user.id)){setTimeout(function(){enter(session.user)},0)}
  });
})();
})();
</script>
</body>
</html>
